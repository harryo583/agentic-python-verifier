[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-python-verifier"
version = "0.1.0"
description = "Correctness-first agentic pipeline from natural language to verified Python via PlusCal and TLA+."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
