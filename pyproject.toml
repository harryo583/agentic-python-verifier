[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-python-verifier"
version = "0.2.0"
description = "Proof-driven Python code generation via agentic PlusCal+invariant co-synthesis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires TLA2TOOLS_JAR and/or ANTHROPIC_API_KEY",
]
